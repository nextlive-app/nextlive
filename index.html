<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FREEDOM STREAMING</title>
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* ===================== THEME & BASE ===================== */
    :root {
      --primary: #e50914;
      --primary-hover: #ff1e2a;
      --bg-color: #f4f7f6;
      --text-main: #1a1c23;
      --text-muted: #666;
      --card-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.07);
    }

    html, body {
      width: 100%; min-height: 100vh;
      margin: 0; padding: 0;
      background: var(--bg-color); 
      color: var(--text-main); 
      font-family: 'Prompt', sans-serif;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      /* Background Effect */
      background-image: radial-gradient(circle at 10% 20%, rgba(229, 9, 20, 0.05) 0%, transparent 20%),
                        radial-gradient(circle at 90% 80%, rgba(229, 9, 20, 0.05) 0%, transparent 20%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { padding: 15px; padding-bottom: 70px; }
    .container { max-width: 1000px; margin: 0 auto; width: 100%; }

    /* ===================== UI ELEMENTS (Liquid Cards) ===================== */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 16px;
    }

    .app-header { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
    .top-bar-row { display: flex; justify-content: space-between; align-items: center; }
    .logo-text { font-size: 24px; font-weight: 700; color: var(--primary); letter-spacing: 1px; }
    
    .menu-toggle-btn {
      background: #fff; border: 1px solid #eee; color: var(--text-main);
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
    }
    .menu-toggle-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    .search-box { position: relative; }
    .search-input {
      width: 100%; padding: 14px 40px 14px 45px;
      background: #fff; border: 1px solid #e0e0e0;
      border-radius: 30px; color: var(--text-main); font-size: 15px;
      outline: none; box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
      transition: all 0.3s; font-family: 'Prompt', sans-serif;
    }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(229, 9, 20, 0.1); }
    .search-box .fa-magnifying-glass { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #999; }
    .search-clear-btn { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: #999; cursor: pointer; display: none; }

    /* ===================== GRID & MOVIES ===================== */
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; margin-bottom: 12px; }
    .section-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .view-all-btn { background: transparent; border: none; color: var(--primary); font-size: 14px; font-weight: 600; cursor: pointer; }

    .horizontal-row {
      display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .horizontal-row::-webkit-scrollbar { display: none; }
    .horizontal-row .movie-card { flex: 0 0 140px; width: 140px; }
    @media (min-width: 600px) { .horizontal-row .movie-card { flex: 0 0 170px; width: 170px; } }

    .movies-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
    @media (min-width: 480px) { .movies-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px) { .movies-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 1024px) { .movies-grid { grid-template-columns: repeat(6, 1fr); } }

    .movie-card {
      background: var(--card-bg); border-radius: 12px; overflow: hidden;
      cursor: pointer; position: relative; border: 1px solid #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .movie-card:hover { transform: translateY(-6px); box-shadow: 0 12px 25px rgba(229, 9, 20, 0.15); border-color: rgba(229, 9, 20, 0.3); }
    .movie-card img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; display: block; background: #eee; }
    .movie-card .card-title { padding: 10px; font-size: 13px; font-weight: 600; text-align: center; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ===================== DETAIL PAGE (Replacing Popup) ===================== */
    #main-content-area, #home-header-area { transition: opacity 0.3s ease; }
    #detail-view { display: none; animation: fadeIn 0.3s ease; padding-bottom: 40px; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .detail-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .back-btn {
      background: #fff; color: var(--text-main); border: 1px solid #ddd;
      padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: all 0.2s;
    }
    .back-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Player Area */
    .detail-player-wrapper {
      width: 100%; aspect-ratio: 16 / 9; background: #000;
      border-radius: 16px; overflow: hidden; position: relative;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2); margin-bottom: 25px;
    }
    .detail-player-wrapper video, .detail-player-wrapper iframe { width: 100%; height: 100%; border: none; object-fit: contain; }
    
    .video-seek-overlay {
      position: absolute; inset: 0; display: flex; justify-content: space-between;
      align-items: center; padding: 0 20px; pointer-events: none; z-index: 5;
    }
    .seek-btn {
      pointer-events: auto; background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4); color: #fff;
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; backdrop-filter: blur(5px); transition: all 0.2s;
    }
    .seek-btn:hover { background: var(--primary); border-color: var(--primary); transform: scale(1.1); }

    /* Info Area */
    .detail-info-box {
      display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px;
      padding: 20px; background: #fff; border-radius: 16px; border: 1px solid #eee;
      box-shadow: 0 5px 20px rgba(0,0,0,0.03);
    }
    @media (min-width: 600px) { .detail-info-box { flex-direction: row; } }
    
    .detail-cover { width: 120px; flex-shrink: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .detail-cover img { width: 100%; display: block; aspect-ratio: 2/3; object-fit: cover; }
    
    .detail-meta { display: flex; flex-direction: column; justify-content: center; }
    .detail-title { font-size: 22px; font-weight: 700; color: var(--primary); margin-bottom: 8px; line-height: 1.3; }
    .detail-current-ep { font-size: 15px; color: var(--text-muted); font-weight: 500; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .detail-desc { font-size: 14px; color: #555; line-height: 1.6; }

    /* Episodes Area */
    .detail-episodes-section { margin-top: 20px; }
    .detail-episodes-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    
    .detail-ep-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    }
    @media (min-width: 600px) { .detail-ep-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 900px) { .detail-ep-grid { grid-template-columns: repeat(6, 1fr); } }

    .ep-btn {
      background: #fff; border: 1px solid #e0e0e0; color: var(--text-main);
      padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 500;
      cursor: pointer; text-align: left; transition: all 0.2s;
      display: flex; flex-direction: column; gap: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .ep-btn:hover { border-color: var(--primary); background: #fdf5f5; transform: translateY(-2px); }
    .ep-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 12px rgba(229, 9, 20, 0.2); }

    /* Audio Badges */
    .audio-badge { font-size: 10px; padding: 3px 8px; border-radius: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .audio-badge.thai { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .ep-btn.active .audio-badge.thai { background: rgba(255,255,255,0.2); color: #fff; border-color: rgba(255,255,255,0.4); }
    .audio-badge.sub { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
    .ep-btn.active .audio-badge.sub { background: rgba(255,255,255,0.2); color: #fff; border-color: rgba(255,255,255,0.4); }
    .audio-badge.other { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
    .ep-btn.active .audio-badge.other { background: rgba(255,255,255,0.2); color: #fff; border-color: rgba(255,255,255,0.4); }

    /* ===================== SIDEBAR ===================== */
    .sidebar-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 10000; display: none; backdrop-filter: blur(2px); }
    .sidebar-backdrop.active { display: block; }
    #app-sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 280px; max-width: 80vw;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); z-index: 10001;
      transform: translateX(-100%); transition: transform 0.3s ease;
      display: flex; flex-direction: column; border-right: 1px solid #eee;
      box-shadow: 5px 0 25px rgba(0,0,0,0.1);
    }
    #app-sidebar.active { transform: translateX(0); }
    .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
    .sidebar-menu-item {
      display: flex; align-items: center; gap: 12px; padding: 14px 20px;
      background: transparent; border: none; color: var(--text-main);
      font-size: 15px; font-weight: 500; font-family: 'Prompt', sans-serif;
      cursor: pointer; text-align: left; transition: all 0.2s; border-bottom: 1px solid #f5f5f5;
    }
    .sidebar-menu-item:hover { background: #fdf5f5; color: var(--primary); padding-left: 25px; }

    #toast {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: var(--primary); color: #fff; padding: 12px 24px; 
      border-radius: 30px; font-size: 14px; font-weight: bold; z-index: 20000; 
      opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
      box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3);
    }
  </style>
</head>
<body>

<div id="toast">แจ้งเตือน</div>

<!-- MAIN PAGE -->
<div class="container" id="home-view">
  <div class="app-header" id="home-header-area">
    <div class="top-bar-row">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="menu-toggle-btn" onclick="openSidebar()" title="เมนู"><i class="fa-solid fa-bars"></i></button>
        <div class="logo-text"><i class="fa-solid fa-play-circle"></i> FREEDOM</div>
      </div>
    </div>
    
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" class="search-input" placeholder="ค้นหาภาพยนตร์, ซีรีส์..." oninput="onSearchInput(this.value)">
      <i class="fa-solid fa-xmark search-clear-btn" id="search-clear-btn" onclick="clearSearch()"></i>
    </div>
  </div>

  <div id="main-content-area"></div>
</div>

<!-- DETAIL PAGE (New Full Page Layout instead of Popup) -->
<div class="container" id="detail-view">
  <div class="detail-nav">
    <button class="back-btn" onclick="closeDetailView()"><i class="fa-solid fa-arrow-left"></i> กลับหน้าแรก</button>
  </div>

  <!-- Video Player -->
  <div class="detail-player-wrapper" id="video-swipe-area">
    <video id="video" controls crossorigin="anonymous" playsinline></video>
    <iframe id="embed-iframe" src="" allowfullscreen></iframe>
    
    <div class="video-seek-overlay" id="video-seek-overlay">
      <button class="seek-btn" onclick="rewind10s()" title="ถอยหลัง 10 วินาที"><i class="fa-solid fa-rotate-left"></i></button>
      <button class="seek-btn" onclick="forward10s()" title="เดินหน้า 10 วินาที"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
  </div>

  <!-- Meta Info Box -->
  <div class="detail-info-box">
    <div class="detail-cover">
      <img id="detail-cover-img" src="" alt="cover">
    </div>
    <div class="detail-meta">
      <h1 class="detail-title" id="detail-title">ชื่อเรื่อง</h1>
      <div class="detail-current-ep" id="detail-current-ep">ตอนที่ 1 <span class="audio-badge thai">พากย์ไทย</span></div>
      <div class="detail-desc" id="detail-desc">เนื้อหา/รายละเอียดเบื้องต้น (ถ้ามีข้อมูลจะแสดงที่นี่) ...</div>
    </div>
  </div>

  <!-- Episode List -->
  <div class="detail-episodes-section">
    <div class="detail-episodes-title">
      <span><i class="fa-solid fa-list-ul" style="color: var(--primary);"></i> เลือกตอนทั้งหมด</span>
      <span style="font-size: 14px; font-weight: normal; color: #666;" id="detail-ep-count">0 ตอน</span>
    </div>
    <div class="detail-ep-grid" id="detail-ep-grid">
      <!-- Buttons will be generated here -->
    </div>
  </div>
</div>

<!-- Sidebar Menu -->
<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>
<div id="app-sidebar">
  <div class="sidebar-header">
    <div class="logo-text" style="font-size: 20px;"><i class="fa-solid fa-play-circle"></i> เมนู</div>
    <button class="menu-toggle-btn" style="border:none; box-shadow:none; background:transparent;" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div style="padding: 10px 0;" id="sidebar-menu-container"></div>
</div>

<script>
  // ==================== ANTI-INSPECT (F12, CTRL+SHIFT+I, Right Click) ====================
  document.addEventListener('contextmenu', event => event.preventDefault()); // ป้องกันคลิกขวา
  document.onkeydown = function(e) {
    if (e.keyCode == 123) return false; // F12
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Ctrl+Shift+J
    if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
  };

  // ==================== CORE LOGIC ====================
  const WORKER_BASE_URL = "https://red-bird-2ec6.misterkunpan.workers.dev/";
  const PROXY_URL = WORKER_BASE_URL + "?url=";
  const FALLBACK_IMAGE = "https://via.placeholder.com/300x450/eeeeee/999999?text=NO+IMAGE";

  const video = document.getElementById('video');
  let hls = null;
  let searchTimer = null;

  let masterDatabase = {};
  let currentGroupData = null;
  let currentPlayIndex = 0;

  const CATEGORIES = [
    { id: "history", title: "⏱️ ดูค้างไว้ / ประวัติ" },
    { id: "movies", title: "🎬 ภาพยนตร์ทั้งหมด", sources: [{ id: "cat1", name: "037HD" }, { id: "cat6", name: "iMovie" }, { id: "cat3", name: "หนังชุด" }] },
    { id: "cat2", title: "📺 ซีรีส์ทั้งหมด" },
    { id: "cat4", title: "⏪ ย้อนหลัง" },
    { id: "cat5", title: "🎥 ซีรีส์ทั่วไป" }
  ];

  video.onended = () => {
    if (currentGroupData && currentPlayIndex < currentGroupData.stations.length - 1) {
      showToast("เล่นตอนถัดไปอัตโนมัติ...");
      setTimeout(() => { 
        currentPlayIndex++;
        playCurrentEpisode();
      }, 1500);
    }
  };

  function rewind10s() { if (video) video.currentTime = Math.max(0, video.currentTime - 10); }
  function forward10s() { if (video && video.duration) video.currentTime = Math.min(video.duration, video.currentTime + 10); }

  function getAudioBadgeHtml(group, station) {
    let rawText = "";
    if (station && station.info) rawText += " " + station.info;
    if (group) {
      if (group.info) rawText += " " + group.info;
      if (group.description) rawText += " " + group.description;
    }
    const text = rawText.toLowerCase();

    if (text.includes("พากย์ไทย") || text.includes("thai audio")) return `<span class="audio-badge thai">พากย์ไทย</span>`;
    if (text.includes("ซับไทย") || text.includes("sub")) return `<span class="audio-badge sub">ซับไทย</span>`;
    if (station && station.info && station.info.trim()) return `<span class="audio-badge other">${station.info.trim()}</span>`;
    return "";
  }
  
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg; t.style.opacity = '1';
    setTimeout(() => { t.style.opacity = '0'; }, 2500);
  }

  function getSeriesKey(groupName) { return 'series_v6_' + groupName.trim().replace(/\s+/g, '_'); }

  video.ontimeupdate = () => {
    if (!currentGroupData || video.paused || isNaN(video.currentTime)) return;
    if (video.currentTime > 2) { 
      const seriesKey = getSeriesKey(currentGroupData.name);
      localStorage.setItem(`last_time_${seriesKey}_${currentPlayIndex}`, video.currentTime);
    }
  };

  function saveCurrentProgress() {
    if (!currentGroupData) return;
    const seriesKey = getSeriesKey(currentGroupData.name);
    localStorage.setItem(`last_ep_${seriesKey}`, currentPlayIndex);
    let historyOrder = JSON.parse(localStorage.getItem('user_history_order_v6') || '[]');
    historyOrder = historyOrder.filter(key => key !== seriesKey);
    historyOrder.unshift(seriesKey);
    localStorage.setItem('user_history_order_v6', JSON.stringify(historyOrder));
  }

  window.onload = async () => {
    const mainArea = document.getElementById('main-content-area');
    mainArea.innerHTML = '<div style="text-align:center; padding:50px; color:#999;"><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดข้อมูล...</div>';
    await fetchAllDatabases();
    renderHomeView();
  };

  async function fetchAllDatabases() {
    try {
      const rawCatIds = ["cat1", "cat2", "cat3", "cat4", "cat5", "cat6"];
      const fetchPromises = rawCatIds.map(async catId => {
        try {
          const res = await fetch(`${WORKER_BASE_URL}?cat=${catId}&_nocache=${Date.now()}`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          return { id: catId, groups: data.groups || [] };
        } catch (e) { return { id: catId, groups: [] }; }
      });
      const results = await Promise.all(fetchPromises);
      results.forEach(res => { masterDatabase[res.id] = res.groups; });
    } catch (err) { showToast("เกิดข้อผิดพลาดในการโหลดข้อมูล"); }
  }

  function getCombinedCategoryData(catItem) {
    if (catItem.sources) {
      let combined = [];
      catItem.sources.forEach(src => {
        let items = masterDatabase[src.id] || [];
        items = items.map(item => ({ ...item, _source: src.id }));
        combined = combined.concat(items);
      });
      return Array.from(new Set(combined.map(g => g.name))).map(name => combined.find(g => g.name === name));
    }
    return masterDatabase[catItem.id] || [];
  }

  function renderHomeView() {
    document.getElementById('home-view').style.display = 'block';
    document.getElementById('detail-view').style.display = 'none';
    const mainArea = document.getElementById('main-content-area');
    mainArea.innerHTML = '';

    let historyOrder = JSON.parse(localStorage.getItem('user_history_order_v6') || '[]');
    let allGroupsFlat = Object.values(masterDatabase).flat();
    let historyGroups = historyOrder.map(seriesKey => allGroupsFlat.find(group => group.name && getSeriesKey(group.name) === seriesKey)).filter(Boolean);

    if (historyGroups.length > 0) mainArea.appendChild(createRowSection("⏱️ ดูค้างไว้ / ประวัติ", historyGroups));

    CATEGORIES.forEach(cat => {
      if (cat.id === 'history') return;
      const groups = getCombinedCategoryData(cat);
      if (groups.length > 0) mainArea.appendChild(createRowSection(cat.title, groups));
    });
  }

  function createRowSection(title, groups) {
    const sectionDiv = document.createElement('div');
    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `<div class="section-title">${title}</div>`;
    sectionDiv.appendChild(header);

    const row = document.createElement('div');
    row.className = 'horizontal-row';

    groups.slice(0, 15).forEach(group => {
      let rawImg = group.image || (group.stations && group.stations[0]?.image);
      const card = document.createElement('div');
      card.className = 'movie-card';
      card.innerHTML = `<img src="${rawImg || FALLBACK_IMAGE}" onerror="this.src='${FALLBACK_IMAGE}';"><div class="card-title">${group.name}</div>`;
      card.onclick = () => openDetailView(group.name);
      row.appendChild(card);
    });
    sectionDiv.appendChild(row);
    return sectionDiv;
  }

  function onSearchInput(keyword) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => handleSearch(keyword), 300);
  }

  function handleSearch(keyword) {
    const cleanKeyword = keyword.trim().toLowerCase();
    if (cleanKeyword === '') { renderHomeView(); return; }
    
    const mainArea = document.getElementById('main-content-area');
    let allGroupsFlat = Object.values(masterDatabase).flat();
    let uniqueGroups = Array.from(new Set(allGroupsFlat.map(g => g.name))).map(name => allGroupsFlat.find(g => g.name === name));
    let filtered = uniqueGroups.filter(item => item.name && item.name.toLowerCase().includes(cleanKeyword));

    mainArea.innerHTML = `<div class="section-title" style="margin-top:20px; margin-bottom:15px;">ผลการค้นหา: "${keyword}"</div>`;
    
    if(filtered.length === 0) {
      mainArea.innerHTML += '<div style="text-align:center; padding:30px; color:#999;">ไม่พบข้อมูล</div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'movies-grid';
    filtered.forEach(group => {
      let rawImg = group.image || (group.stations && group.stations[0]?.image);
      const card = document.createElement('div');
      card.className = 'movie-card';
      card.innerHTML = `<img src="${rawImg || FALLBACK_IMAGE}" onerror="this.src='${FALLBACK_IMAGE}';"><div class="card-title">${group.name}</div>`;
      card.onclick = () => openDetailView(group.name);
      grid.appendChild(card);
    });
    mainArea.appendChild(grid);
  }

  function clearSearch() {
    document.getElementById('search-input').value = '';
    renderHomeView();
  }

  // ==================== DETAIL VIEW LOGIC ====================
  function openDetailView(groupName) {
    let allGroupsFlat = Object.values(masterDatabase).flat();
    const group = allGroupsFlat.find(g => g.name === groupName);
    if (!group || !group.stations || group.stations.length === 0) { showToast("ไม่พบลิงก์วิดีโอ"); return; }

    currentGroupData = group;
    const seriesKey = getSeriesKey(group.name);
    const lastEp = localStorage.getItem(`last_ep_${seriesKey}`);
    currentPlayIndex = lastEp !== null ? parseInt(lastEp) : 0;
    if (currentPlayIndex >= group.stations.length) currentPlayIndex = 0;

    document.getElementById('home-view').style.display = 'none';
    document.getElementById('detail-view').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });

    // Set Info
    let rawImg = group.image || (group.stations && group.stations[0]?.image) || FALLBACK_IMAGE;
    document.getElementById('detail-cover-img').src = rawImg;
    document.getElementById('detail-title').innerText = group.name;
    document.getElementById('detail-desc').innerText = group.description || "ภาพยนตร์/ซีรีส์คุณภาพ ให้บริการสตรีมมิ่งฟรีจาก FREEDOM";
    document.getElementById('detail-ep-count').innerText = `รวม ${group.stations.length} ตอน`;

    renderEpisodeGrid();
    playCurrentEpisode();
  }

  function closeDetailView() {
    if (hls) { hls.destroy(); hls = null; }
    if (!video.paused) video.pause();
    document.getElementById('detail-view').style.display = 'none';
    document.getElementById('home-view').style.display = 'block';
  }

  function renderEpisodeGrid() {
    const grid = document.getElementById('detail-ep-grid');
    grid.innerHTML = '';
    
    currentGroupData.stations.forEach((st, idx) => {
      const btn = document.createElement('button');
      btn.className = `ep-btn ${idx === currentPlayIndex ? 'active' : ''}`;
      const badge = getAudioBadgeHtml(currentGroupData, st);
      const epName = st.name || `ตอนที่ ${idx + 1}`;
      
      btn.innerHTML = `<span style="font-size:14px; font-weight:600;">${epName}</span> ${badge}`;
      btn.onclick = () => {
        currentPlayIndex = idx;
        renderEpisodeGrid(); // Update active state
        playCurrentEpisode();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      grid.appendChild(btn);
    });
  }

  function playCurrentEpisode() {
    if (!currentGroupData) return;
    const station = currentGroupData.stations[currentPlayIndex];
    if (!station || !station.url) return;

    const badge = getAudioBadgeHtml(currentGroupData, station);
    const epName = station.name || `ตอนที่ ${currentPlayIndex + 1}`;
    document.getElementById('detail-current-ep').innerHTML = `กำลังเล่น: ${epName} ${badge}`;

    saveCurrentProgress();

    const videoEl = document.getElementById('video');
    const iframeEl = document.getElementById('embed-iframe');
    const seekOverlay = document.getElementById('video-seek-overlay');

    if (station.url.includes('ssplayer168.xyz')) {
      if (hls) { hls.destroy(); hls = null; }
      videoEl.pause(); videoEl.style.display = 'none'; seekOverlay.style.display = 'none';
      iframeEl.style.display = 'block'; iframeEl.src = station.url;
    } else {
      iframeEl.style.display = 'none'; videoEl.style.display = 'block'; seekOverlay.style.display = 'flex';
      const streamUrl = PROXY_URL + encodeURIComponent(station.url);
      if (hls) { hls.destroy(); hls = null; }

      const seriesKey = getSeriesKey(currentGroupData.name);
      const savedTime = parseFloat(localStorage.getItem(`last_time_${seriesKey}_${currentPlayIndex}`) || '0');

      if (Hls.isSupported()) {
        hls = new Hls({ maxBufferLength: 45, enableWorker: true });
        hls.loadSource(streamUrl); hls.attachMedia(videoEl);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          videoEl.play().then(() => { if (savedTime > 3) videoEl.currentTime = savedTime; }).catch(() => {});
        });
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        videoEl.src = streamUrl;
        videoEl.addEventListener('loadedmetadata', () => {
          videoEl.play().then(() => { if (savedTime > 3) videoEl.currentTime = savedTime; }).catch(() => {});
        });
      }
    }
  }

  // ==================== SIDEBAR ====================
  function openSidebar() {
    const container = document.getElementById('sidebar-menu-container');
    container.innerHTML = '';
    
    const homeBtn = document.createElement('button');
    homeBtn.className = 'sidebar-menu-item';
    homeBtn.innerHTML = `<i class="fa-solid fa-house"></i> หน้าแรก`;
    homeBtn.onclick = () => { closeSidebar(); closeDetailView(); renderHomeView(); };
    container.appendChild(homeBtn);

    document.getElementById('sidebar-backdrop').classList.add('active');
    document.getElementById('app-sidebar').classList.add('active');
  }

  function closeSidebar() {
    document.getElementById('sidebar-backdrop').classList.remove('active');
    document.getElementById('app-sidebar').classList.remove('active');
  }
</script>
</body>
</html>
